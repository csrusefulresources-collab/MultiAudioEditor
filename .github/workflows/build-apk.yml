name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: "MultiAudioEditor"
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x gradlew; ./gradlew assembleRelease --no-daemon; else gradle assembleRelease --no-daemon; fi
      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing setup is missing. Open Signing Key Setup in GitHub Manager and tap Auto Setup."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d "[:space:]" | base64 -d > /tmp/release.keystore
          KS_TYPE="JKS"
          if [ "$(od -An -tx1 -N1 /tmp/release.keystore | tr -d "[:space:]")" = "30" ]; then KS_TYPE="PKCS12"; fi
          if ! keytool -list -keystore /tmp/release.keystore -storetype "$KS_TYPE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "The saved keystore password or alias does not match the keystore file. Open My Signing Key in GitHub Manager, create a new key, then run Auto Setup again."
            exit 1
          fi
          BT_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BT_DIR" ]; then echo "Android build-tools not found"; exit 1; fi
          rm -rf /tmp/signed_apks && mkdir -p /tmp/signed_apks
          find . -type f -name '*.apk' \( -path '*/outputs/*' -o -path '*/bin/*' \) -not -path './APK/*' -not -path './.git/*' -print0 > /tmp/apk_list
          if [ ! -s /tmp/apk_list ]; then find . -type f -name '*.apk' -not -path './APK/*' -not -path './.git/*' -print0 > /tmp/apk_list; fi
          if [ ! -s /tmp/apk_list ]; then echo 'No APK file was produced by the build'; exit 1; fi
          while IFS= read -r -d "" apk; do
            BASE=$(basename "$apk" .apk)
            BASE="${BASE%-unsigned}"
            "$BT_DIR/zipalign" -f -p 4 "$apk" "/tmp/${BASE}-aligned.apk"
            "$BT_DIR/apksigner" sign --ks /tmp/release.keystore --ks-type "$KS_TYPE" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "/tmp/signed_apks/${BASE}-signed.apk" "/tmp/${BASE}-aligned.apk"
            "$BT_DIR/apksigner" verify "/tmp/signed_apks/${BASE}-signed.apk"
          done < /tmp/apk_list
          rm -f /tmp/release.keystore
          ls /tmp/signed_apks/*.apk
      - name: Save APK in the APK folder
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout -- . || true
          rm -rf APK && mkdir -p APK
          cp /tmp/signed_apks/*.apk APK/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f APK
          git commit -m "Add built APK [skip ci]" || echo "Nothing new to commit"
          git pull --rebase --autostash origin "main" || true
          git push origin "HEAD:refs/heads/main"
      - uses: actions/upload-artifact@v4
        with:
          name: "app-release-signed"
          path: "APK/*.apk"
          if-no-files-found: warn
